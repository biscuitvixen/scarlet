# Pinned so the volume names below do not follow the checkout directory:
# a renamed folder would otherwise start her on fresh, empty volumes
name: scarlet

services:
  bot:
    build: .
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    volumes:
      # sqlite db (user timezones etc) survives container recreates
      - bot-data:/app/data
    depends_on:
      - lavalink

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    restart: unless-stopped
    environment:
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      # Secret, kept in .env. application.yml reads it as a ${} placeholder.
      YOUTUBE_OAUTH_REFRESH_TOKEN: ${YOUTUBE_OAUTH_REFRESH_TOKEN:-}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      # Cache downloaded plugin jars so they survive container recreates.
      # Lavalink runs as uid 322 but docker creates fresh volumes as root,
      # so on first run on a new machine the plugin download hits
      # "Permission denied" until:
      #   docker run --rm -v scarlet_lavalink-plugins:/p alpine chown -R 322:322 /p
      - lavalink-plugins:/opt/Lavalink/plugins
    expose:
      - "2333"

volumes:
  lavalink-plugins:
  bot-data:
